    # ── Schedule ──
    /createIntelligentPlaylist:
        post:
            summary: Create a new intelligent playlist
            operationId: createIntelligentPlaylist
            description: Creates an intelligent playlist (schedule type 4) that automatically populates its content based on search criteria such as tags, collections, and date ranges. First creates the schedule resource, then creates the associated intelligent playlist item with the search configuration.
            tags:
                - Schedule
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                collections:
                                    type: array
                                    items:
                                        type: object
                                    description: The collections to filter content by
                                endSearchDate:
                                    type: string
                                    description: The end date for the content search range
                                endSearchDurationInMinutes:
                                    type: integer
                                    description: The end search duration in minutes
                                name:
                                    type: string
                                    description: The display name for the intelligent playlist
                                relatedContents:
                                    type: object
                                    description: The related content filter criteria
                                searchDate:
                                    type: string
                                    description: The start date for the content search range
                                searchDurationInMinutes:
                                    type: integer
                                    description: The search duration in minutes
                                searchFilterType:
                                    type: string
                                    description: The type of search filter to apply
                                tags:
                                    type: array
                                    items:
                                        type: object
                                    description: The tags to filter content by
                                thumbnailAsset:
                                    type: object
                                    description: The thumbnail asset for the playlist
                            required:
                                - collections
                                - endSearchDate
                                - endSearchDurationInMinutes
                                - name
                                - relatedContents
                                - searchDate
                                - searchDurationInMinutes
                                - searchFilterType
                                - tags
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '500':
                    description: An internal server error occurred

