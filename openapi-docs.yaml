                                destinationFolderId:
                                    type: string
                                    description: The unique identifier of the destination folder
                                collections:
                                    type: array
                                    nullable: true
                                    items:
                                        type: string
                                    description: Optional collection IDs (or lookup objects)
                                relatedContents:
                                    type: array
                                    nullable: true
                                    items:
                                        type: string
                                    description: Optional related content IDs (or lookup objects)
                                tags:
                                    type: array
                                    nullable: true
                                    items:
                                        type: string
                                    description: Optional tag IDs (or lookup objects); IDs, not tag names
                                properties:
                                    type: object
                                    nullable: true
                                    description: Optional additional properties for the composition
                            required:
