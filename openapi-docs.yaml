    # ── Saved Search ──
    /addSavedSearch:
        post:
            summary: Add a new saved search
            operationId: addSavedSearch
            description: Creates a saved search with the specified name, visibility settings, and search criteria. The search criteria (query, filters, sort fields, etc.) are stored so the search can be re-executed later. Supports pagination, scoring, and custom result field selection.
            tags:
                - Saved Search
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name:
                                    type: string
                                    description: The name of the saved search
                                featured:
                                    type: boolean
                                    description: Whether the saved search is featured
                                bookmarked:
                                    type: boolean
                                    description: Whether the saved search is bookmarked
                                public:
                                    type: boolean
                                    description: 'Sent, but not applied: the API''s saved search add model has no public field'
                                sequence:
                                    type: integer
                                    description: The display order sequence number
                                savedSearchType:
                                    type: integer
                                    description: 'Sent, but not applied when adding: the add model has no display type'
                                query:
                                    type: string
                                    description: 'The search query string (stored as searchTerms and as the criteria''s searchQuery)'
                                offset:
                                    type: integer
                                    description: The page offset for pagination (stored in criteria, defaults to 0)
                                size:
                                    type: integer
                                    description: The page size for results (stored in criteria, defaults to 10)
                                filters:
                                    type: array
                                    items:
                                        type: object
                                    description: An array of search filters (stored in criteria), or an advanced-search filter object (sent as advanceSearchFilters)
                                sortFields:
                                    type: array
                                    items:
                                        type: object
                                    description: An array of sort fields (stored in criteria), or a sort field name (sent as sortField)
                                searchResultFields:
                                    type: array
                                    items:
                                        type: string
                                    description: Array of field names to include in results (stored in criteria)
                                similarAssetId:
                                    type: string
                                    description: The ID of an asset to find similar results for (stored in criteria)
                                minScore:
                                    type: integer
                                    description: The minimum relevance score threshold for results (stored in criteria)
                                excludeTotalRecordCount:
                                    type: boolean
                                    description: Whether to exclude the total record count (stored in criteria)
                                filterBinder:
                                    type: string
                                    description: The logical binder for combining filters (stored in criteria)
                            required:
                                - name
                                - featured
                                - bookmarked
                                - public
                                - sequence
                                - savedSearchType
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated

    /deleteSavedSearch:
        delete:
            summary: Delete a saved search
            operationId: deleteSavedSearch
            description: Permanently removes a saved search identified by its SAVED_SEARCH_ID.
            tags:
                - Saved Search
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                savedSearchId:
                                    type: string
                                    description: The unique identifier of the saved search to delete
                            required:
                                - savedSearchId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The saved search was not found

    /getSavedSearch:
        get:
            summary: Get a saved search by SAVED_SEARCH_ID
            operationId: getSavedSearch
            description: Retrieves the details of a specific saved search, including its name, visibility settings, and search criteria.
            tags:
                - Saved Search
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                savedSearchId:
                                    type: string
                                    description: The unique identifier of the saved search
                            required:
                                - savedSearchId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The saved search was not found

    /getSavedSearches:
        get:
            summary: Get all saved searches
            operationId: getSavedSearches
            description: Retrieves the list of all saved searches available to the authenticated user.
            tags:
                - Saved Search
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated

    /getSearchSaved:
        post:
            summary: Run a search described as an unsaved saved search
            operationId: getSearchSaved
            description: 'Sends the query, filters, and pagination parameters as a saved search''s criteria and returns the matching content, without storing a saved search. Supports similarity search and scoring thresholds.'
            tags:
                - Saved Search
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                query:
                                    type: string
                                    description: The search query string
                                offset:
                                    type: integer
                                    description: The page offset for pagination
                                size:
                                    type: integer
                                    description: The page size for results
                                filters:
                                    type: array
                                    items:
                                        type: object
                                    description: Array of filter objects to apply to the search
                                sortFields:
                                    type: array
                                    items:
                                        type: object
                                    description: Array of sort field objects for ordering results
                                searchResultFields:
                                    type: array
                                    items:
                                        type: object
                                    description: 'Fields to include in results. Currently not applied: this endpoint replaces them with its deprecated returnedFieldNames query parameter'
                                similarAssetId:
                                    type: string
                                    description: The ID of an asset to find similar results for
                                minScore:
                                    type: integer
                                    description: The minimum relevance score threshold for results
                                excludeTotalRecordCount:
                                    type: boolean
                                    description: Whether to exclude the total record count from results
                                filterBinder:
                                    type: string
                                    description: 'The logical binder for combining filters (e.g., "AND", "OR")'
                            required:
                                - query
                                - offset
                                - size
                                - filters
                                - sortFields
                                - searchResultFields
                                - similarAssetId
                                - minScore
                                - excludeTotalRecordCount
                                - filterBinder
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated

    /getSearchSavedById:
        get:
            summary: Execute a saved search by SAVED_SEARCH_ID
            operationId: getSearchSavedById
            description: Retrieves and executes a previously saved search by its SAVED_SEARCH_ID, returning the search results using the stored search criteria.
            tags:
                - Saved Search
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                savedSearchId:
                                    type: string
                                    description: The unique identifier of the saved search to execute
                            required:
                                - savedSearchId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The saved search was not found

    /patchSavedSearch:
        patch:
            summary: Partially update a saved search
            operationId: patchSavedSearch
            description: Performs a partial update of a saved search, allowing individual fields to be modified without affecting other properties. Only the provided fields are updated; omitted fields remain unchanged. Boolean fields (featured, bookmarked) support explicit `false` values. The API patches name, sequence, featured and bookmarked only.
            tags:
                - Saved Search
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                savedSearchId:
                                    type: string
                                    description: The unique identifier of the saved search to update
                                name:
                                    type: string
                                    description: The new name for the saved search
                                featured:
                                    type: boolean
                                    description: Whether the saved search is featured
                                bookmarked:
                                    type: boolean
                                    description: Whether the saved search is bookmarked
                                public:
                                    type: boolean
                                    description: 'Sent, but not applied: the API''s patch model has no public field'
                                sequence:
                                    type: integer
                                    description: The display order sequence number
                            required:
                                - savedSearchId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The saved search was not found

    /updateSavedSearch:
        put:
            summary: Update an existing saved search
            operationId: updateSavedSearch
            description: Performs a full update of a saved search identified by SAVED_SEARCH_ID. First retrieves the current saved search data, then merges provided values with existing values (falling back to current values for any parameters not supplied). This ensures all fields are populated in the update request.
            tags:
                - Saved Search
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                savedSearchId:
                                    type: string
                                    description: The unique identifier of the saved search to update
                                name:
                                    type: string
                                    description: The name of the saved search
                                featured:
                                    type: boolean
                                    description: Whether the saved search is featured
                                bookmarked:
                                    type: boolean
                                    description: Whether the saved search is bookmarked
                                public:
                                    type: boolean
                                    description: 'Sent, but not applied: the API''s saved search update model has no public field'
                                sequence:
                                    type: integer
                                    description: The display order sequence number
                                savedSearchType:
                                    type: integer
                                    description: 'Sent, but not applied: the update model has no display type'
                                query:
                                    type: string
                                    description: The search query string
                                offset:
                                    type: integer
                                    description: The page offset for pagination
                                size:
                                    type: integer
                                    description: The page size for results
                                filters:
                                    type: array
                                    items:
                                        type: object
                                    description: Array of filter objects to apply to the search
                                sortFields:
                                    type: array
                                    items:
                                        type: object
                                    description: Array of sort field objects for ordering results
                                searchResultFields:
                                    type: array
                                    items:
                                        type: string
                                    description: Array of field names to include in results
                                similarAssetId:
                                    type: string
                                    description: The ID of an asset to find similar results for
                                minScore:
                                    type: integer
                                    description: The minimum relevance score threshold for results
                                excludeTotalRecordCount:
                                    type: boolean
                                    description: Whether to exclude the total record count from results
                                filterBinder:
                                    type: string
                                    description: 'The logical binder for combining filters (e.g., "AND", "OR")'
                            required:
                                - savedSearchId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The saved search was not found


    # ── Share ──
    /deleteShare:
        delete:
            summary: Delete a share
            operationId: deleteShare
            description: Permanently removes a share identified by its share ID, revoking all associated access permissions.
            tags:
                - Share
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                shareId:
                                    type: string
                                    description: The unique identifier of the share to delete
                            required:
                                - shareId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The share was not found

    /getShare:
        get:
            summary: Get a share by ID
            operationId: getShare
            description: Retrieves the details of a specific share, including its contents, permissions, sharing configuration, and expiration settings.
            tags:
                - Share
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                shareId:
                                    type: string
                                    description: The unique identifier of the share to retrieve
                            required:
                                - shareId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The share was not found

    /share:
        post:
            summary: Create a new share
            operationId: share
            description: Creates a share with the specified content, permissions, and sharing settings. Shares allow content to be distributed to other users with configurable access duration, permissions, and expiration.
            tags:
                - Share
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                id:
                                    type: string
                                    description: The unique identifier for the share
                                name:
                                    type: string
                                    description: The display name of the share
                                sharedContents:
                                    type: array
                                    items:
                                        type: object
                                    description: Array of content objects included in the share
                                sharedDuration:
                                    type: object
                                    description: The duration configuration for the share
                                sharedPermissions:
                                    type: object
                                    description: The permission settings for shared users
                                sharedType:
                                    type: object
                                    description: The type of share (e.g., link-based, user-based)
                                sharedStatus:
                                    type: object
                                    description: The current status of the share
                                sharedDurationInHours:
                                    type: integer
                                    description: The share duration expressed in hours
                                sharedLink:
                                    type: string
                                    description: The shareable link URL
                                ownerId:
                                    type: string
                                    description: The ID of the user who owns the share
                                expirationDate:
                                    type: string
                                    description: The expiration date/time of the share
                                assetId:
                                    type: string
                                    description: The ID of the asset being shared
                                sharedUsers:
                                    type: array
                                    items:
                                        type: object
                                    description: Array of Nomad user objects to share with
                            required:
                                - id
                                - name
                                - sharedContents
                                - sharedDuration
                                - sharedPermissions
                                - sharedType
                                - sharedStatus
                                - sharedDurationInHours
                                - sharedLink
                                - ownerId
                                - expirationDate
                                - assetId
                                - sharedUsers
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated

    /shareExpire:
        post:
            summary: Expire a share
            operationId: shareExpire
            description: Immediately expires a share, revoking access for all shared users regardless of the original expiration date. This effectively disables the share without deleting it.
            tags:
                - Share
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                shareId:
                                    type: string
                                    description: The unique identifier of the share to expire
                            required:
                                - shareId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The share was not found

    /shareNotification:
        post:
            summary: Send share notifications
            operationId: shareNotification
            description: Sends notification emails to the specified Nomad users and/or external users, informing them about the shared content. This can be used to notify users after a share has been created or updated.
            tags:
                - Share
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                shareId:
                                    type: string
                                    description: The unique identifier of the share to notify about
                                nomadUsers:
                                    type: array
                                    items:
                                        type: object
                                    description: Array of Nomad user objects to notify
                                externalUsers:
                                    type: array
                                    items:
                                        type: object
                                    description: Array of external user objects to notify
                            required:
                                - shareId
                                - nomadUsers
                                - externalUsers
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The share was not found

    /updateShare:
        put:
            summary: Update an existing share
            operationId: updateShare
            description: 'Performs a full update of a share identified by its share ID. First retrieves the current share data, then merges provided values with existing values (falling back to current values for any parameters not supplied). The API always uses SHARE_ID as the share''s id.'
            tags:
                - Share
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                shareId:
                                    type: string
                                    description: The unique identifier of the share to update (used in the URL)
                                id:
                                    type: string
                                    description: Sent in the share body, but the API replaces it with SHARE_ID
                                name:
                                    type: string
                                    description: The display name of the share
                                sharedContents:
                                    type: array
                                    items:
                                        type: object
                                    description: Array of content objects included in the share
                                sharedDuration:
                                    type: object
                                    description: The duration configuration for the share
                                sharedPermissions:
                                    type: object
                                    description: The permission settings for shared users
                                sharedType:
                                    type: object
                                    description: The type of share
                                sharedStatus:
                                    type: object
                                    description: The current status of the share
                                sharedDurationInHours:
                                    type: integer
                                    description: The share duration expressed in hours
                                sharedLink:
                                    type: string
                                    description: The shareable link URL
                                ownerId:
                                    type: string
                                    description: The ID of the user who owns the share
                                expirationDate:
                                    type: string
                                    description: The expiration date/time of the share
                                assetId:
                                    type: string
                                    description: The ID of the asset being shared
                                sharedUsers:
                                    type: array
                                    items:
                                        type: object
                                    description: Array of Nomad user objects to share with
                            required:
                                - shareId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The share was not found


    # ── Video Tracking ──
    /getVideoTracking:
        get:
            summary: Record or retrieve a video tracking event for an asset
            operationId: getVideoTracking
            description: Sends a tracking beacon for the specified asset, recording the playback event type and the current playback position.
            tags:
                - Video Tracking
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                assetId:
                                    type: string
                                    description: The unique identifier of the video asset being tracked
                                trackingEvent:
                                    type: string
                                    description: 'The tracking event type (e.g., "play", "pause", "complete")'
                                seconds:
                                    type: integer
                                    description: The current playback position in seconds
                                liveChannelId:
                                    type: string
                                    description: The live channel ID if tracking a live stream
                                contentId:
                                    type: string
                                    description: The content ID associated with the tracking event
                                profileId:
                                    type: string
                                    description: The profile ID associated with the tracking event
                            required:
                                - assetId
                                - trackingEvent
                                - seconds
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated


    # ── Misc Functions ──
    /uploadAsset:
        post:
            summary: Upload a file as a new or replacement asset
            operationId: uploadAsset
            description: Starts a multipart upload, sends the file in 8 MB parts (larger for files over about 12 GB, which the server splits into at most 1,500 parts) directly to storage `maxWorkers` parts at a time, then requests completion. Parts are read from the file one at a time, so the whole file is never held in memory. Failed parts are retried with backoff. If anything fails before completion is requested, the upload is cancelled and the error is thrown.
            tags:
                - Misc Functions
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name:
                                    type: string
                                    nullable: true
                                    description: The name of the asset.
                                existingAssetId:
                                    type: string
                                    nullable: true
                                    description: The Existing AssetId (file) that should be overwritten with this upload. Note that by specifying this attribute then the parentId, relativePath and displayName are all ignored.
                                relatedContentId:
                                    type: string
                                    nullable: true
                                    description: The Content ID of the related content record to associate this asset to. Note that by specifying this attribute then the parentId and relativePath attributes are both ignored.
                                uploadOverwriteOption:
                                    type: string
                                    description: The overwrite option for the upload. The option you want to use when uploading the asset. The options are continue, replace, and cancel. Continue continues the upload from where it left off. Replace replaces an existing asset. Replace is the one you want to use if you are starting a new upload. Cancel cancels an uploading asset.
                                file:
                                    type: string
                                    format: binary
                                    description: A browser File/Blob, the full or relative path of the file to upload (Node.js), or an object carrying the bytes in `buffer` plus `size` and `name`/`originalName`. This is ignored if the ExistingAssetId or if the RelatedContentId has a value.
                                parentId:
                                    type: string
                                    nullable: true
                                    description: The Parent AssetId (folder) to add the upload to. Note that if there is a full relativePath, then it is appended to this parent path. If this value is omitted then the file will be added to the predefined incoming folder. This is ignored if the ExistingAssetId or if the RelatedContentId has a value.
                                languageId:
                                    type: string
                                    nullable: true
                                    description: The language of the asset to upload. If this is left blank then the default system language is used.
                                uploadReplaceOptions:
                                    type: array
                                    nullable: true
                                    items:
                                        type: string
                                    description: Gets or sets if the asset already exists on the server, this decides how to handle the situation with related assets.
                                options:
                                    type: object
                                    nullable: true
                                    description: Upload tuning options.
                                    properties:
                                        maxWorkers:
                                            type: integer
                                            description: The number of parts uploaded concurrently.
                                        partConfirmation:
                                            type: string
                                            description: 'When parts are confirmed with the server: `"per_part"` confirms each part as soon as it is uploaded, so the transfer list shows live progress; `"at_end"` skips the per-part calls and sends every part''s ETag on the final complete call instead, which is faster for large files. `"at_end"` requires an API version that accepts a part list on `POST /asset/upload/{id}/complete` (2026.9.1 or later).'
                                        onProgress:
                                            type: object
                                            format: function
                                            description: Called after each part with `(bytesUploaded, totalBytes)`.
                                        reportProgress:
                                            type: boolean
                                            description: 'Whether to send progress to the server (at most every 5 seconds) so the transfer list shows it. With `"per_part"` the server already tracks progress from the part confirmations; with `"at_end"` this is the only progress it sees. Leave it off, with `"at_end"`, for the fewest API calls and the fastest upload.'
                            required:
                                - uploadOverwriteOption
                                - file
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request

    /uploadRelatedAsset:
        post:
            summary: Upload a file as a related asset of an existing asset
            operationId: uploadRelatedAsset
            description: Uploads a file that will be associated as a related asset (e.g., subtitle track, alternate language version) to an existing asset, using the same multipart upload as `uploadAsset`. If anything fails before completion is requested, the upload is cancelled and the error is thrown.
            tags:
                - Misc Functions
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                existingAssetId:
                                    type: string
                                    description: Gets or sets the Existing AssetId (file) that should be overwritten with this upload. Note that by specifying this attribute then the parentId, relativePath and displayName are all ignored.
                                relatedAssetId:
                                    type: string
                                    nullable: true
                                    description: 'Gets or sets the related asset ID of the existingAsset that we''re replacing. If this is used, most of the other properties are not needed.'
                                newRelatedAssetMetadataType:
                                    type: string
                                    nullable: true
                                    description: Gets or sets the type of the related asset metadata to be created for a given ExistingAssetId. If specified, ExistingAssetId has to have a value defined.
                                uploadOverwriteOption:
                                    type: string
                                    description: The overwrite option for the upload. The option you want to use when uploading the asset. The options are continue, replace, and cancel. Continue continues the upload from where it left off. Replace replaces an existing asset. Replace is the one you want to use if you are starting a new upload.
                                file:
                                    type: string
                                    format: binary
                                    description: A browser File/Blob, the full or relative path of the file to upload (Node.js), or an object carrying the bytes in `buffer` plus `size` and `name`/`originalName`.
                                languageId:
                                    type: string
                                    nullable: true
                                    description: The language of the asset to upload. If this is left blank then the default system language is used.
                                options:
                                    type: object
                                    nullable: true
                                    description: Upload tuning options; see `uploadAsset`.
                                    properties:
                                        maxWorkers:
                                            type: integer
                                            description: The number of parts uploaded concurrently.
                                        partConfirmation:
                                            type: string
                                            description: '`"per_part"` or `"at_end"`.'
                                        onProgress:
                                            type: object
                                            format: function
                                            description: Called after each part with `(bytesUploaded, totalBytes)`.
                                        reportProgress:
                                            type: boolean
                                            description: Whether to send progress to the server; see `uploadAsset`.
                            required:
                                - existingAssetId
                                - uploadOverwriteOption
                                - file
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request


components:
    schemas:
        SearchFilter:
            type: object
            properties:
                fieldName:
                    type: string
                    description: The content field to filter on
                operator:
                    type: string
                    description: 'Comparison operator (e.g. "Equals", "Contains", "GreaterThan")'
                values:
                    type: array
                    items:
                        type: object
                    description: The value or array of values to match
            required:
                - fieldName
                - operator
                - values
        SortField:
            type: object
            properties:
                fieldName:
                    type: string
                    description: The field to sort on
                sortType:
                    type: string
                    description: 'Sort direction: "Ascending" or "Descending"'
            required:
                - fieldName
                - sortType
        SearchResultField:
            type: object
            properties:
                name:
                    type: string
                    description: Field name to include in results
                SearchResultFields:
                    type: array
                    items:
                        type: object
                    description: Nested sub-fields for object fields
            required:
                - name
        TagRef:
            type: object
            properties:
                id:
                    type: string
                    description: Tag ID
                description:
                    type: string
                    description: Tag description
            required:
                - id
        CollectionRef:
            type: object
            properties:
                id:
                    type: string
                    description: Collection ID
                description:
                    type: string
                    description: Collection description
            required:
                - id
        RelatedContentRef:
            type: object
            properties:
                id:
                    type: string
                    description: Related content ID
                description:
                    type: string
                    description: Description
            required:
                - id
        AudioTrack:
            type: object
            properties:
                id:
                    type: string
                    description: Audio track ID
                name:
                    type: string
                    description: Track name
                language:
                    type: string
                    description: Language code
            required:
                - id
        ExternalOutputProfile:
            type: object
            properties:
                id:
                    type: string
                    description: Output profile ID
                name:
                    type: string
                    description: Profile name
                profileType:
                    type: string
                    description: Profile type identifier
            required:
                - id
        LiveInputSource:
            type: object
            properties:
                url:
                    type: string
                    description: Source stream URL
                id:
                    type: string
                    description: Source ID
            required:
                - url
        LiveInputDestination:
            type: object
            properties:
                url:
                    type: string
                    description: Destination stream URL
                id:
                    type: string
                    description: Destination ID
                name:
                    type: string
                    description: Destination name
            required:
                - url
        LiveOutputProfile:
            type: object
            properties:
                id:
                    type: string
                    description: Output profile ID
                name:
                    type: string
                    description: Profile name
                type:
                    type: string
                    description: Profile type
            required:
                - id
        MediaSource:
            type: object
            properties:
                assetId:
                    type: string
                    description: The asset ID to include in the composition
                startTimeCode:
                    type: string
                    description: 'Start timecode (HH:MM:SS:FF)'
                endTimeCode:
                    type: string
                    description: 'End timecode (HH:MM:SS:FF)'
                id:
                    type: string
                    description: Source segment ID
            required:
                - assetId
                - startTimeCode
                - endTimeCode
        MediaBuilderItem:
            type: object
            properties:
                sourceAssetId:
                    type: string
                    description: The asset ID to use as the source for this media builder item
                startTimeCode:
                    type: string
                    description: 'Start timecode for the segment (HH:MM:SS:FF)'
                endTimeCode:
                    type: string
                    description: 'End timecode for the segment (HH:MM:SS:FF)'
            required:
                - sourceAssetId
                - startTimeCode
                - endTimeCode
        Annotation:
            type: object
            properties:
                id:
                    type: string
                    description: Annotation ID
                startTimeCode:
                    type: string
                    description: 'Start timecode for the annotation (HH:MM:SS:FF)'
                endTimeCode:
                    type: string
                    description: 'End timecode for the annotation (HH:MM:SS:FF)'
                properties:
                    type: object
                    description: 'Annotation properties (e.g. { title: "..." })'
            required:
                - startTimeCode
                - properties
        ContentRef:
            type: object
            properties:
                id:
                    type: string
                    description: Content ID
            required:
                - id
        NomadUser:
            type: object
            properties:
                id:
                    type: string
                    description: User ID
        ExternalUser:
            type: object
            properties:
                email:
                    type: string
                    description: External user email address
                id:
                    type: string
                    description: External user ID
                externalUserType:
                    type: string
                    description: Type of external user
            required:
                - email
        ContentField:
            type: object
            properties:
                contentFieldId:
                    type: string
                    description: Unique identifier of the content field
                properties:
                    type: object
                    description: Field property definitions (title, type, etc.)
            required:
                - contentFieldId
                - properties
        Transfer:
            type: object
            properties:
                id:
                    type: string
                    description: The transfer id (UUID), which cancel, requeue and progress calls address
                direction:
                    type: integer
                    description: 'Which way the asset moves: 1 = Upload, 2 = Download'
                transferStatus:
                    type: string
                    description: 'Lifecycle state: one of "Queued", "Downloading", "Uploading", "Error", "Complete", "Cancelled"'
                displayName:
                    type: string
                    description: A human readable label, normally the file name
                completePercentage:
                    type: integer
                    description: Percent complete, 0 to 100, when known
                bytesTransferred:
                    type: integer
                    description: Bytes moved so far
                bytesTotal:
                    type: integer
                    description: Total size of the transfer, or 0 when not known up front
                attemptCount:
                    type: integer
                    description: How many times this transfer has been attempted
                errorMessage:
                    type: string
                    description: The failure reason. Only populated for a failed transfer
                createdDate:
                    type: string
                    description: When the record was created (ISO 8601)
                queueDate:
                    type: string
                    description: When the transfer was queued (ISO 8601)
                startTransferDate:
                    type: string
                    description: When bytes first started moving (ISO 8601)
                completeTransferDate:
                    type: string
                    description: When the transfer finished successfully (ISO 8601)
                cancelledDate:
                    type: string
                    description: When the transfer was cancelled (ISO 8601)
                errorDate:
                    type: string
                    description: When the transfer failed (ISO 8601)
                lastProgressDate:
                    type: string
                    description: When progress was last recorded (ISO 8601)
                assetId:
                    type: string
                    description: The asset this transfer concerns (UUID), in either direction
                downloadProxy:
                    type: boolean
                    description: Whether a download is taking the proxy rendition rather than the original. Download only
                relatedAssetId:
                    type: string
                    description: The asset this upload is a related file of (UUID). Upload only
                displayObjectKey:
                    type: string
                    description: The destination object key as shown to a user. Upload only
                assetName:
                    type: string
                    description: The display name of the asset. Download only
                assetUrl:
                    type: string
                    description: 'The internal URL of the asset in `{bucketName}::{objectKey}` format. Download only'
                fullPreviewUrl:
                    type: string
                    description: 'A signed URL of the asset''s thumbnail image, when one is available'
            required:
                - id
                - direction
                - transferStatus
                - bytesTransferred
                - bytesTotal
                - attemptCount
                - createdDate
        UploadQueueItem:
            type: object
            properties:
                fileName:
                    type: string
                    description: The file name, including its extension
                fileSize:
                    type: integer
                    description: The file size in bytes
                mimeType:
                    type: string
                    description: The MIME type, when known; otherwise inferred from the file name
                destinationFolderId:
                    type: string
                    description: The destination folder (UUID); omit for the configured default upload folder
                chunkSize:
                    type: integer
                    description: The multipart part size in bytes, e.g. 8388608
                uploadOverwriteOption:
                    type: string
                    description: 'How to treat an existing file: "continue", "replace" (default) or "cancel"'
            required:
                - fileName
                - fileSize
                - chunkSize
        TransferList:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/Transfer'
                    description: The page of transfers
                totalItemCount:
                    type: integer
                    description: The number of transfers matching the filters; approximate for very large histories
                nextPageOffset:
                    type: string
                    description: The opaque cursor to pass back as `cursor` for the next page. A null value means the end has been reached
                hasItems:
                    type: boolean
                    description: Whether the items collection contains any items
                message:
                    type: string
                    description: An optional message providing additional information about the result
            required:
                - items
                - totalItemCount
                - hasItems
        TransferSummary:
            type: object
            properties:
                uploadCounts:
                    type: object
                    description: Per-status counts for uploads, keyed by status name (Queued, Downloading, Uploading, Error, Complete, Cancelled)
                downloadCounts:
                    type: object
                    description: Per-status counts for downloads, keyed by status name
                activeCount:
                    type: integer
                    description: Number of transfers that have not reached a terminal state
                errorCount:
                    type: integer
                    description: Number of transfers that ended in failure
                changeToken:
                    type: string
                    description: A token that changes whenever any counted value changes; usable for If-None-Match polling
            required:
                - activeCount
                - errorCount
