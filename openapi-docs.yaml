    /recordLiveChannelFromHlsArtifacts:
        post:
            summary: 'Assemble a VOD HLS recording from a live channel''s stored HLS artifacts'
            operationId: recordLiveChannelFromHlsArtifacts
            description: 'Scans the live channel''s Red5 HLS upload location for partitions that overlap the requested time window, aggregates the video and subtitle segments, writes an assembled VOD HLS master manifest and variant playlists, registers a placeholder asset, and queues the recording to be materialized. The live channel itself is not modified. For long windows, set `RUN_IN_BACKGROUND` to avoid gateway timeouts; the call then returns immediately with no body and the outcome is written to the audit log.'
            tags:
                - Live Channel
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                liveChannelId:
                                    type: string
                                    description: The unique identifier of the live channel
                                recordingBaseFileName:
                                    type: string
                                    description: The base file name for the recording asset, without extension
                                folderAssetId:
                                    type: string
                                    description: The folder the recording asset is registered in
                                recordingStartDateTime:
                                    type: string
                                    description: The recording start, in UTC (ISO 8601)
                                recordingDurationSeconds:
                                    type: integer
                                    description: The recording length in seconds
                                runInBackground:
                                    type: boolean
                                    description: Whether to process asynchronously and return immediately. Defaults to false
                            required:
                                - liveChannelId
                                - recordingBaseFileName
                                - folderAssetId
                                - recordingStartDateTime
                                - recordingDurationSeconds
            responses:
                '200':
                    description: Success
                '400':
                    description: The channel is not a Red5 HLS channel, or no segments were found in the window
                '401':
                    description: The caller is not authenticated

