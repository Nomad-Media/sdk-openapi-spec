    /autoClipAsset:
        post:
            summary: Automatically detect and clip the content region of a video asset
            operationId: autoClipAsset
            description: 'Analyzes perceptual hashes of frames across the asset''s HLS TS chunks to find the preroll and postroll boundaries, then clips the detected content region.'
            tags:
                - Asset
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                assetId:
                                    type: string
                                    description: The unique identifier of the source video asset
                                background:
                                    type: boolean
                                    description: Whether to run the auto-clip as a background job
                                clipOptions:
                                    type: object
                                    nullable: true
                                    description: Optional clip settings sent as the request body. Only the keys you provide are sent
                                    properties:
                                        title:
                                            type: string
                                            description: Title of the created clip asset
                                        outputFolderId:
                                            type: string
                                            description: Folder asset ID the clip is created in
                                        tags:
                                            type: array
                                            items:
                                                type: object
                                            description: Tags to apply to the clip
                                        collections:
                                            type: array
                                            items:
                                                type: object
                                            description: Collections to add the clip to
                                        relatedContent:
                                            type: array
                                            items:
                                                type: object
                                            description: Related content to link to the clip
                                        internalMasterManifestUrl:
                                            type: string
                                            description: Master manifest URL to clip from
                                        similarityThresholdOverride:
                                            type: integer
                                            description: Overrides the frame-similarity threshold used to detect the loop boundaries
                                        fullScan:
                                            type: boolean
                                            description: Scan every chunk instead of using the adaptive search
                                        submitClipJob:
                                            type: boolean
                                            description: Whether to submit the clip job after detection
                            required:
                                - assetId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The source asset was not found


    # ── Asset Queue ──
    /addDownloadsToQueue:
        post:
            summary: 'Add one or more assets to the caller''s download queue'
            operationId: addDownloadsToQueue
            description: Queues the specified assets for batch downloading. Folders and collections are expanded to the file assets inside them; an asset already queued or in flight is left alone, while one that previously finished, failed or was cancelled is retried in place. Optionally requests the lower-resolution proxy version instead of the original media. Large requests are handed to a background worker and this returns immediately.
            tags:
                - Asset Queue
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                ids:
                                    type: array
                                    items:
                                        type: string
                                    description: The asset identifiers (UUIDs) to add to the download queue
                                downloadProxy:
                                    type: boolean
                                    description: Whether to download the proxy (lower-resolution) version
                            required:
                                - ids
            responses:
                '200':
                    description: Success
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Transfer'
                '400':
                    description: No asset ids were provided
                '401':
                    description: The caller is not authenticated

    /addUploadsToQueue:
        post:
            summary: 'Add one or more files to the caller''s upload queue'
            operationId: addUploadsToQueue
            description: 'Starts a client upload for each file. Small batches are started inline and a transfer is returned for each; larger batches are handed to a background worker and an empty array is returned immediately - poll `getTransfersSummary` to see the entries appear. This only registers the uploads: fetch each one''s pre-signed part URLs with `getTransfer("uploads", id)` once its id is known, then send the bytes.'
            tags:
                - Asset Queue
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                items:
                                    type: array
                                    items:
                                        $ref: '#/components/schemas/UploadQueueItem'
                                    description: The files to queue, one entry per file
                            required:
                                - items
            responses:
                '200':
                    description: Success
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Transfer'
                '400':
                    description: No upload items were provided
                '401':
                    description: The caller is not authenticated

    /getTransfers:
        get:
            summary: 'List the caller''s asset transfers, newest first'
            operationId: getTransfers
            description: 'Returns one page of the caller''s own transfers, optionally filtered by direction and status. By default both directions are included and merged in date order. Pagination uses an opaque cursor: pass the `nextPageOffset` from a response back as `CURSOR` to continue; a null `nextPageOffset` means the end has been reached. `totalItemCount` is the number of transfers matching the direction and status filters; it is approximate for very large histories.'
            tags:
                - Asset Queue
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                direction:
                                    type: string
                                    description: 'Which side to include: "Upload", "Download", or "All". Defaults to both'
                                statuses:
                                    type: array
                                    items:
                                        type: string
                                    description: 'Filter by one or more transfer statuses ("Queued", "Downloading", "Uploading", "Error", "Complete", "Cancelled"). Omit for all'
                                pageSize:
                                    type: integer
                                    description: The number of items per page, capped at 200
                                cursor:
                                    type: string
                                    description: The opaque `nextPageOffset` cursor returned by a previous call
                                oldestFirst:
                                    type: boolean
                                    description: Whether to return the oldest transfers first. Ignored when `SORT_BY` is set
                                sortBy:
                                    type: string
                                    description: 'A field to sort by instead of date, e.g. "queueDate", "transferStatus" or "assetTitle"'
                                sortDescending:
                                    type: boolean
                                    description: Whether to sort `SORT_BY` descending. Defaults to ascending
            responses:
                '200':
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TransferList'
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated

    /getTransfersSummary:
        get:
            summary: 'Count the caller''s transfers by state'
            operationId: getTransfersSummary
            description: Returns per-status counts for both directions plus active and failed totals, for badge counts and for deciding whether anything is still moving. The `changeToken` carried in the response can be used for If-None-Match polling.
            tags:
                - Asset Queue
            responses:
                '200':
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TransferSummary'
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated

    /deleteTransfers:
        delete:
            summary: 'Remove transfers from the caller''s queue'
            operationId: deleteTransfers
            description: Removes the given transfer records for the direction. Ids that do not belong to the caller are skipped rather than failing the request. This removes the bookkeeping only; it does not cancel work in flight, so cancel the transfer first if that is the intent.
            tags:
                - Asset Queue
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                direction:
                                    type: string
                                    description: 'The transfer direction path segment: "uploads" or "downloads"'
                                ids:
                                    type: array
                                    items:
                                        type: string
                                    description: The transfer identifiers (UUIDs) to remove
                            required:
                                - direction
                                - ids
            responses:
                '200':
                    description: Success
                '400':
                    description: No transfer ids were provided
                '401':
                    description: The caller is not authenticated

    /clearTransferHistory:
        delete:
            summary: 'Remove all of the caller''s transfer history'
            operationId: clearTransferHistory
            description: The server pages through every transfer owned by the caller and deletes them all; no transfer ids are needed. This removes the bookkeeping only - it does not cancel work in flight, so cancel active transfers first if that is the intent. To remove specific transfers, use `deleteTransfers`.
            tags:
                - Asset Queue
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                direction:
                                    type: string
                                    description: 'Which side to clear: "Upload", "Download", or "All". Defaults to both'
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated

    /getTransfer:
        get:
            summary: 'Fetch a single transfer from the caller''s queue'
            operationId: getTransfer
            description: 'Retrieves one of the caller''s transfers by direction and identifier.'
            tags:
                - Asset Queue
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                direction:
                                    type: string
                                    description: 'The transfer direction path segment: "uploads" or "downloads"'
                                transferId:
                                    type: string
                                    description: The unique identifier (UUID) of the transfer
                            required:
                                - direction
                                - transferId
            responses:
                '200':
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Transfer'
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: No such transfer belongs to the caller

    /updateTransfer:
        patch:
            summary: 'Report status or progress for one of the caller''s transfers'
            operationId: updateTransfer
            description: 'Records the reported state. Reporting the in-progress state for the direction ("Downloading" for downloads, "Uploading" for uploads) is a progress update; reporting a final state ("Complete", "Error", "Cancelled") ends the transfer. Progress fields are only read while the transfer is in an in-progress state, and upload progress reports are ignored because the server counts bytes itself.'
            tags:
                - Asset Queue
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                direction:
                                    type: string
                                    description: 'The transfer direction path segment: "uploads" or "downloads"'
                                transferId:
                                    type: string
                                    description: The unique identifier (UUID) of the transfer
                                transferStatus:
                                    type: string
                                    description: 'The new transfer status: one of "Queued", "Downloading", "Uploading", "Error", "Complete", "Cancelled"'
                                completePercentage:
                                    type: integer
                                    description: Percent complete, 0 to 100. Only read for an in-progress status
                                bytesTransferred:
                                    type: integer
                                    description: Bytes moved so far, when the client tracks it
                                errorMessage:
                                    type: string
                                    description: 'The failure reason. Only read alongside the "Error" status'
                                bytesTotal:
                                    type: integer
                                    description: 'The total size in bytes, when known to the client. Downloads only: lets the server derive a percentage from `BYTES_TRANSFERRED`. Set once; later values are ignored'
                            required:
                                - direction
                                - transferId
            responses:
                '200':
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Transfer'
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: No such transfer belongs to the caller

    /cancelTransfer:
        post:
            summary: 'Cancel one of the caller''s transfers'
            operationId: cancelTransfer
            description: Ends the transfer. For an upload this also releases the storage-side multipart upload, so an abandoned upload stops accruing storage cost.
            tags:
                - Asset Queue
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                direction:
                                    type: string
                                    description: 'The transfer direction path segment: "uploads" or "downloads"'
                                transferId:
                                    type: string
                                    description: The unique identifier (UUID) of the transfer to cancel
                            required:
                                - direction
                                - transferId
            responses:
                '200':
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Transfer'
                '400':
                    description: The transfer had already finished
                '401':
                    description: The caller is not authenticated
                '404':
                    description: No such transfer belongs to the caller

    /requeueTransfer:
        post:
            summary: 'Retry one of the caller''s finished transfers'
            operationId: requeueTransfer
            description: 'Returns the transfer to the queue as a new attempt, keeping its history and incrementing its attempt count, rather than creating a second record. Only a finished transfer ("Complete", "Error" or "Cancelled") can be requeued.'
            tags:
                - Asset Queue
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                direction:
                                    type: string
                                    description: 'The transfer direction path segment: "uploads" or "downloads"'
                                transferId:
                                    type: string
                                    description: The unique identifier (UUID) of the transfer to requeue
                            required:
                                - direction
                                - transferId
            responses:
                '200':
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Transfer'
                '400':
                    description: The transfer has not finished, so there is nothing to retry
                '401':
                    description: The caller is not authenticated
                '404':
                    description: No such transfer belongs to the caller


    # ── Content Metadata ──
    /addCustomProperties:
        patch:
            summary: Add or update custom properties on an asset
            operationId: addCustomProperties
            description: Patches the specified asset with custom metadata properties, including name, date, availability window, and any custom key-value properties. Only provided fields are updated; omitted fields remain unchanged.
            tags:
                - Content Metadata
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                contentId:
                                    type: string
                                    description: The unique identifier of the asset to update
                                name:
                                    type: string
                                    description: New display name for the asset (sent as displayName)
                                date:
                                    type: string
                                    description: New display date for the asset in ISO 8601 format (sent as displayDate)
                                customProperties:
                                    type: object
                                    description: Key-value pairs of custom metadata properties
                                availableStartDate:
                                    type: string
                                    description: Start date for content availability in ISO 8601 format
                                availableEndDate:
                                    type: string
                                    description: End date for content availability in ISO 8601 format
                            required:
                                - contentId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The asset was not found

    /addRelatedContent:
        post:
            summary: Add a related content association to a content item
            operationId: addRelatedContent
            description: 'Creates a relationship between two content items. The API endpoint used depends on the SDK configuration: admin API uses `/admin/related`, portal API uses `/content/related`.'
            tags:
                - Content Metadata
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                contentId:
                                    type: string
                                    description: The ID of the content item to add the relation to
                                relatedContentId:
                                    type: string
                                    description: The ID of the content item to relate
                                contentDefinition:
                                    type: object
                                    description: The content definition object with id and description
                            required:
                                - contentId
                                - relatedContentId
                                - contentDefinition
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: One of the content items was not found

    /addTagOrCollection:
        post:
            summary: Add a tag or collection to a content item
            operationId: addTagOrCollection
            description: Associates an existing tag or collection with a content item. Can also create a new tag/collection if CREATE_NEW is true. The TAG_TYPE parameter determines whether a tag or collection is being added. The endpoint varies by API type (admin vs portal).
            tags:
                - Content Metadata
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                tagType:
                                    type: string
                                    description: 'The type of metadata: "tag" or "collection"'
                                contentId:
                                    type: string
                                    description: The ID of the content item
                                contentDefinition:
                                    type: object
                                    description: The content definition object with id and description
                                tagName:
                                    type: string
                                    description: The name of the tag or collection
                                tagId:
                                    type: string
                                    description: The ID of an existing tag or collection (null if creating new)
                                createNew:
                                    type: boolean
                                    description: 'Whether to create a new tag/collection if it doesn''t exist'
                            required:
                                - tagType
                                - contentId
                                - contentDefinition
                                - tagName
                                - tagId
                                - createNew
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated

    /bulkUpdateMetadata:
        post:
            summary: Perform bulk metadata updates across multiple content items
            operationId: bulkUpdateMetadata
            description: 'Updates collections, tags and related content for multiple content items in a single request. Merges new values with existing metadata from the first content item''s asset details.'
            tags:
                - Content Metadata
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                contentIds:
                                    type: array
                                    items:
                                        type: string
                                    description: Array of content IDs to update
                                collectionIds:
                                    type: array
                                    items:
                                        type: string
                                    description: Collection IDs to add
                                relatedContentIds:
                                    type: array
                                    items:
                                        type: string
                                    description: Related content IDs to add
                                tagIds:
                                    type: array
                                    items:
                                        type: string
                                    description: Tag IDs to add
                                schemaName:
                                    type: string
                                    description: Not sent. Kept for backward compatibility; the API currently only supports bulk updates of assets
                            required:
                                - contentIds
            responses:
                '200':
                    description: Success
                '400':
                    description: Missing content IDs or property changes
                '401':
                    description: The caller is not authenticated

    /createTagOrCollection:
        post:
            summary: Create a new tag or collection
            operationId: createTagOrCollection
            description: Creates a new standalone tag or collection with the specified name. The TAG_TYPE parameter determines whether a tag or collection is created.
            tags:
                - Content Metadata
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                tagType:
                                    type: string
                                    description: 'The type of metadata to create: "tag" or "collection"'
                                tagName:
                                    type: string
                                    description: The name for the new tag or collection
                            required:
                                - tagType
                                - tagName
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated

    /deleteRelatedContent:
        post:
            summary: Remove a related content association from a content item
            operationId: deleteRelatedContent
            description: Deletes the relationship between two content items. The endpoint varies by API type (admin uses `/admin/related/delete`, portal uses `/content/related/delete`).
            tags:
                - Content Metadata
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                contentId:
                                    type: string
                                    description: The ID of the content item to remove the relation from
                                relatedContentId:
                                    type: string
                                    description: The ID of the related content item to disassociate
                                contentDefinition:
                                    type: object
                                    description: The content definition object with id and description
                            required:
                                - contentId
                                - relatedContentId
                                - contentDefinition
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated

    /deleteTagOrCollection:
        delete:
            summary: Delete a tag or collection
            operationId: deleteTagOrCollection
            description: Permanently removes a tag or collection by its ID. This also removes the tag/collection association from all content items.
            tags:
                - Content Metadata
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                tagType:
                                    type: string
                                    description: 'The type of metadata to delete: "tag" or "collection"'
                                tagId:
                                    type: string
                                    description: The unique identifier of the tag or collection to delete
                            required:
                                - tagType
                                - tagId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The tag or collection was not found

    /getTagOrCollection:
        get:
            summary: Retrieve a tag or collection by its unique identifier
            operationId: getTagOrCollection
            description: Gets the details of a specific tag or collection including its name and associated content items.
            tags:
                - Content Metadata
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                tagType:
                                    type: string
                                    description: 'The type of metadata to retrieve: "tag" or "collection"'
                                tagId:
                                    type: string
                                    description: The unique identifier of the tag or collection
                            required:
                                - tagType
                                - tagId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The tag or collection was not found

    /removeTagOrCollection:
        post:
            summary: Remove a tag or collection from a content item
            operationId: removeTagOrCollection
            description: Disassociates a tag or collection from a specific content item without deleting the tag/collection itself. The endpoint varies by API type (admin vs portal).
            tags:
                - Content Metadata
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                tagType:
                                    type: string
                                    description: 'The type of metadata: "tag" or "collection"'
                                contentId:
                                    type: string
                                    description: The ID of the content item
                                contentDefinitionId:
                                    type: string
                                    description: The content definition ID
                                tagId:
                                    type: string
                                    description: The ID of the tag or collection to remove
                            required:
                                - tagType
                                - contentId
                                - contentDefinitionId
                                - tagId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated


    # ── Ping ──
    /ping:
        post:
            summary: Check if the user session is still valid and update the session activity timestamp
            operationId: ping
            description: 'Validates that the specified session is still active and keeps it alive by updating its last activity timestamp. If single-session enforcement is enabled, detects whether the session has been replaced by a newer login. Also checks whether the user''s account has expired.'
            tags:
                - Ping
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                applicationId:
                                    type: string
                                    description: Optional application identifier to associate with the ping
                                userSessionId:
                                    type: string
                                    description: The user session ID to validate
                            required:
                                - userSessionId
            responses:
                '200':
                    description: Success
                '400':
                    description: The request body is null or UserSessionId is missing
                '401':
                    description: The caller is not authenticated

    /pingAuth:
        get:
            summary: Send an authenticated ping to the server
            operationId: pingAuth
            description: Sends an authenticated heartbeat/ping request with user session information, optionally scoped to a specific application.
            tags:
                - Ping
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                applicationId:
                                    type: string
                                    description: The application ID to scope the ping to
                                userSessionId:
                                    type: string
                                    description: The user session ID to include in the ping
                            required:
                                - userSessionId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated


    # ── Search ──
    /search:
        post:
            summary: Search for content across the platform
            operationId: search
            description: Performs a full-text search against the content index with support for filtering, sorting, pagination, vector similarity search, and LLM-powered search. The API endpoint adapts based on the SDK configuration (admin or portal). Null parameters are automatically stripped from the request body.
            tags:
                - Search
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                query:
                                    type: string
                                    description: Free-text search query string
                                offset:
                                    type: integer
                                    description: Zero-based page offset for pagination
                                size:
                                    type: integer
                                    description: Number of results per page
                                filters:
                                    type: array
                                    items:
                                        type: object
                                    description: Array of filter objects with fieldName, operator, and values
                                sortFields:
                                    type: array
                                    items:
                                        type: object
                                    description: Array of sort field objects with fieldName and sortType
                                searchResultFields:
                                    type: array
                                    items:
                                        type: object
                                    description: Fields to include in results
                                similarAssetId:
                                    type: string
                                    description: Asset ID for vector similarity search
                                minScore:
                                    type: integer
                                    description: Minimum relevance score threshold
                                excludeTotalRecordCount:
                                    type: boolean
                                    description: Skip total count for faster queries
                                filterBinder:
                                    type: string
                                    description: 'Logical operator for combining filters ("0" = AND, "1" = OR)'
                                fullUrlFieldNames:
                                    type: array
                                    items:
                                        type: string
                                    description: Fields to return as full URLs
                                distinctOnFieldName:
                                    type: string
                                    description: Field name for distinct/deduplicated results
                                includeVideoClips:
                                    type: boolean
                                    description: Whether to include video clip results
                                useLlmSearch:
                                    type: boolean
                                    description: Whether to use LLM-powered search
                                includeInternalFieldsInResults:
                                    type: boolean
                                    description: Whether to include internal system fields
                                searchTextFields:
                                    type: array
                                    items:
                                        type: object
                                    description: Specific text fields to search within
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated

    /analyzeMappingConflicts:
        get:
            summary: Analyze content definitions for identifier field mapping conflicts
            operationId: analyzeMappingConflicts
            description: Scans all content definitions and reports fields whose identifier mappings conflict across definitions, which can cause search indexing issues.
            tags:
                - Search
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                maxRecordsPerContentDef:
                                    type: integer
                                    description: The maximum number of records to scan per content definition
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated


    # ── Asset Upload ──
    /reapStaleUploads:
        post:
            summary: Reclaim uploads that have stopped making progress
            operationId: reapStaleUploads
            description: Scans recent upload sessions and cancels any that have stalled, releasing the server-side resources they were holding.
            tags:
                - Asset Upload
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                lookBackDays:
                                    type: integer
                                    description: How many days back to scan for stale uploads
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated


    # ── Audit ──
    /getAudit:
        get:
            summary: Retrieve the audit trail for a content item
            operationId: getAudit
            description: Gets the full audit history for the specified content, including all actions performed on it (create, update, delete, access, etc.) with timestamps and user information.
            tags:
                - Audit
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                contentId:
                                    type: string
                                    description: The unique identifier of the content item to audit
                            required:
                                - contentId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The content item was not found


    # ── Config ──
    /clearServerCache:
        post:
            summary: Clear the server-side cache
            operationId: clearServerCache
            description: Invalidates all cached data on the Nomad CMS server, forcing fresh retrieval of configuration, content, and metadata on subsequent requests.
            tags:
                - Config
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated

    /getConfig:
        get:
            summary: Retrieve the server configuration
            operationId: getConfig
            description: Gets the current server configuration settings. Optionally filters by a specific configuration type.
            tags:
                - Config
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                configType:
                                    type: string
                                    description: Optional configuration type to filter by
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated

    /getServerTime:
        get:
            summary: Get the current server time
            operationId: getServerTime
            description: Returns the current date and time from the Nomad CMS server. Useful for synchronizing client-side timestamps with the server clock.
            tags:
                - Config
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated


    # ── Content ──
    /createContent:
        get:
            summary: Create a new content record for a given content definition
            operationId: createContent
            description: Creates a content record with the specified content definition and language. When `PROPERTIES` is given, they are saved to the new record straight away.
            tags:
                - Content
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                contentDefinitionId:
                                    type: string
                                    description: The ID of the content definition
                                languageId:
                                    type: string
                                    description: The language ID for the content
                                properties:
                                    type: object
                                    description: Property values to save to the new record
                            required:
                                - contentDefinitionId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The content definition was not found

    /deactivateContentUserTrack:
        post:
            summary: Update the deactivation status of a content user tracking session
            operationId: deactivateContentUserTrack
            description: Sets the active/inactive status of a specific user tracking session for a content record. Used to manage content viewing activity tracking.
            tags:
                - Content
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                sessionId:
                                    type: string
                                    description: The unique identifier of the tracking session
                                contentId:
                                    type: string
                                    description: The unique identifier of the content record
                                contentDefinitionId:
                                    type: string
                                    description: The ID of the content definition
                                deactivate:
                                    type: boolean
                                    description: Whether to deactivate the tracking session
                            required:
                                - sessionId
                                - contentId
                                - contentDefinitionId
                                - deactivate
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The tracking session was not found

    /deleteContent:
        delete:
            summary: Delete a content record from the specified content definition
            operationId: deleteContent
            description: Permanently removes the content record identified by the content ID and content definition ID.
            tags:
                - Content
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                contentId:
                                    type: string
                                    description: The unique identifier of the content record to delete
                                contentDefinitionId:
                                    type: string
                                    description: The ID of the content definition
                            required:
                                - contentId
                                - contentDefinitionId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The content record was not found

    /getContent:
        get:
            summary: Retrieve a single content record by its ID within a given content definition
            operationId: getContent
            description: Gets the full content record including all properties, metadata, and revision information for the specified content item.
            tags:
                - Content
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                contentId:
                                    type: string
                                    description: The unique identifier of the content record
                                contentDefinitionId:
                                    type: string
                                    description: The ID of the content definition
                                isRevision:
                                    type: boolean
                                    description: Whether to retrieve a revision version
                            required:
                                - contentId
                                - contentDefinitionId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The content record was not found

    /getContentUserTrack:
        get:
            summary: Retrieve a paginated list of user tracking sessions for a specific content record
            operationId: getContentUserTrack
            description: Gets all user tracking sessions associated with the specified content item, with support for sorting and pagination.
            tags:
                - Content
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                contentId:
                                    type: string
                                    description: The unique identifier of the content record
                                contentDefinitionId:
                                    type: string
                                    description: The ID of the content definition
                                sortColumn:
                                    type: string
                                    description: The column to sort results by
                                isDesc:
                                    type: boolean
                                    description: Whether to sort in descending order
                                pageIndex:
                                    type: integer
                                    description: The page index for pagination (zero-based)
                                pageSize:
                                    type: integer
                                    description: The number of items per page
                            required:
                                - contentId
                                - contentDefinitionId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated

    /getContentUserTrackTouch:
        get:
            summary: Record or update a user session touch event for tracking content viewing activity
            operationId: getContentUserTrackTouch
            description: 'Creates or updates a touch event that records the user''s interaction with the specified content item, used for tracking viewing activity and engagement.'
            tags:
                - Content
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                contentId:
                                    type: string
                                    description: The unique identifier of the content record
                                contentDefinitionId:
                                    type: string
                                    description: The ID of the content definition
                            required:
                                - contentId
                                - contentDefinitionId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated

    /updateContent:
        put:
            summary: Update an existing content record within a content definition
            operationId: updateContent
            description: Retrieves the current content record, merges the provided properties with the existing properties (performing deep comparison), and saves the result. Only changed properties are updated while preserving unchanged values.
            tags:
                - Content
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                contentId:
                                    type: string
                                    description: The unique identifier of the content record to update
                                contentDefinitionId:
                                    type: string
                                    description: The ID of the content definition
                                properties:
                                    type: object
                                    description: The properties to update on the content record
                                languageId:
                                    type: string
                                    description: The language ID for the content
                            required:
                                - contentId
                                - contentDefinitionId
                                - properties
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The content record was not found


    # ── Content Definition ──
    /createContentDefinition:
        get:
            summary: Create a new content definition
            operationId: createContentDefinition
            description: Initializes a new, empty content definition with default settings. The returned object can then be configured with fields, groups, and properties before being saved via updateContentDefinition.
            tags:
                - Content Definition
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated

    /getContentDefinition:
        get:
            summary: Retrieve a content definition by its unique identifier
            operationId: getContentDefinition
            description: Gets the full content definition including all configured fields, properties, security settings, and metadata.
            tags:
                - Content Definition
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                contentDefinitionId:
                                    type: string
                                    description: The unique identifier of the content definition
                            required:
                                - contentDefinitionId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The content definition was not found

    /getContentDefinitions:
        get:
            summary: Retrieve a paginated list of content definitions
            operationId: getContentDefinitions
            description: Gets all content definitions with optional filtering by management type, sorting, and pagination support.
            tags:
                - Content Definition
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                contentManagementType:
                                    type: string
                                    description: Filter by content management type
                                sortColumn:
                                    type: string
                                    description: The column name to sort results by
                                isDesc:
                                    type: boolean
                                    description: Whether to sort in descending order
                                pageIndex:
                                    type: integer
                                    description: The zero-based page index for pagination
                                pageSize:
                                    type: integer
                                    description: The number of results per page
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated

    /updateContentDefinition:
        put:
            summary: Update an existing content definition
            operationId: updateContentDefinition
            description: 'Updates a content definition''s fields, properties, and settings. This method performs a read-modify-write operation: it fetches the current definition to resolve display field and route item name references, then merges the provided values with existing data before saving. Pass `null` for any parameter to preserve its current value.'
            tags:
                - Content Definition
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                contentDefinitionId:
                                    type: string
                                    description: The unique identifier of the content definition to update
                                name:
                                    type: string
                                    description: The display name for the content definition (null to keep existing)
                                contentFields:
                                    type: array
                                    items:
                                        type: object
                                    description: Array of content field definitions (null to keep existing)
                                contentDefinitionGroup:
                                    type: string
                                    description: The group name to assign (null to keep existing)
                                contentDefinitionType:
                                    type: string
                                    description: The type description to assign (null to keep existing)
                                displayField:
                                    type: string
                                    description: The title of the field to use as the display field (null to keep existing)
                                routeItemNameField:
                                    type: string
                                    description: The title of the field to use for route item names (null to keep existing)
                                securityGroups:
                                    type: array
                                    items:
                                        type: string
                                    description: Array of security group names to assign (null to keep existing)
                                systemRoles:
                                    type: array
                                    items:
                                        type: string
                                    description: Array of system role names to assign (null to keep existing)
                                includeInTags:
                                    type: boolean
                                    description: Whether to include this definition in tags (null to keep existing)
                                indexContent:
                                    type: boolean
                                    description: Whether to index content of this type (null to keep existing)
                            required:
                                - contentDefinitionId
                                - name
                                - contentFields
                                - contentDefinitionGroup
                                - contentDefinitionType
                                - displayField
                                - routeItemNameField
                                - securityGroups
                                - systemRoles
                                - includeInTags
                                - indexContent
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The content definition was not found

    /deleteContentDefinition:
        delete:
            summary: Delete a content definition by its unique identifier
            operationId: deleteContentDefinition
            description: Permanently deletes the specified content definition and its associated configuration. Confirmed against the real Admin API (`Nomad.Controller.V1Asset.ContentDefinitionController.Delete`) — this endpoint already exists server-side; this file only adds SDK coverage for it.
            tags:
                - Content Definition
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                contentDefinitionId:
                                    type: string
                                    description: The unique identifier of the content definition to delete
                            required:
                                - contentDefinitionId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The content definition was not found or could not be deleted


    # ── Event ──
    /createAndUpdateEvent:
        get:
            summary: Create or update an event
            operationId: createAndUpdateEvent
            description: Creates a new event or updates an existing one. If no CONTENT_ID is provided, a new content item is created first using the specified content definition. The event properties include scheduling, type, and optional series configuration.
            tags:
                - Event
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                contentId:
                                    type: string
                                    description: The content ID of an existing event to update (null to create new)
                                contentDefinitionId:
                                    type: string
                                    description: The content definition ID for the event type
                                name:
                                    type: string
                                    description: The display name of the event
                                startDatetime:
                                    type: string
                                    description: The event start date/time in ISO 8601 format
                                endDatetime:
                                    type: string
                                    description: The event end date/time in ISO 8601 format
                                eventType:
                                    type: object
                                    description: The event type object with id and description
                                series:
                                    type: object
                                    description: The series configuration if this is a recurring event
                                isDisabled:
                                    type: boolean
                                    description: Whether the event is disabled
                                overrideSeriesProperties:
                                    type: boolean
                                    description: Whether to override inherited series properties
                                seriesProperties:
                                    type: object
                                    description: Additional series-specific properties
                            required:
                                - contentDefinitionId
                                - name
                                - startDatetime
                                - endDatetime
                                - eventType
                                - isDisabled
                                - overrideSeriesProperties
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated

    /deleteEvent:
        delete:
            summary: Delete an event
            operationId: deleteEvent
            description: Permanently removes an event and its associated content by CONTENT_ID and content definition.
            tags:
                - Event
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                contentId:
                                    type: string
                                    description: The content ID of the event to delete
                                contentDefinitionId:
                                    type: string
                                    description: The content definition ID of the event
                            required:
                                - contentId
                                - contentDefinitionId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The event was not found

    /addLiveScheduleToEvent:
        post:
            summary: Add a live schedule configuration to an event
            operationId: addLiveScheduleToEvent
            description: Creates a live schedule associated with the specified event, configuring the live channel, inputs, output profiles, and video overlays (slate, preroll, postroll). Arguments that are null or omitted are not sent, so the API applies its defaults for them.
            tags:
                - Event
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                eventId:
                                    type: string
                                    description: The content ID of the event to add the live schedule to
                                slateVideo:
                                    type: object
                                    description: The slate video asset to display during breaks
                                prerollVideo:
                                    type: object
                                    description: The preroll video asset to play before the event
                                postrollVideo:
                                    type: object
                                    description: The postroll video asset to play after the event
                                isSecureOutput:
                                    type: boolean
                                    description: Whether the output stream is secure
                                archiveFolder:
                                    type: object
                                    description: The archive folder asset for recordings
                                primaryLiveInput:
                                    type: object
                                    description: The primary live input configuration
                                backupLiveInput:
                                    type: object
                                    description: The backup live input configuration
                                primaryLivestreamInputUrl:
                                    type: string
                                    description: The primary livestream input URL
                                backupLivestreamInputUrl:
                                    type: string
                                    description: The backup livestream input URL
                                externalOutputProfiles:
                                    type: array
                                    items:
                                        type: object
                                    description: External output profiles
                                status:
                                    type: object
                                    description: The initial status for the live schedule
                                statusMessage:
                                    type: string
                                    description: The initial status message
                                liveChannel:
                                    type: object
                                    description: The live channel to associate with
                                overrideSettings:
                                    type: boolean
                                    description: 'Whether the live schedule overrides the live channel''s settings'
                                outputProfileGroup:
                                    type: object
                                    description: The output profile group to use
                            required:
                                - eventId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated

    /extendLiveSchedule:
        post:
            summary: Extend a live schedule with recurring copies
            operationId: extendLiveSchedule
            description: Creates recurring copies of the live schedule associated with the specified event, based on the recurring day/week pattern and end date. If no end date is given, it is the current date plus RECURRING_WEEKS weeks. The local time zone offset is sent with the request.
            tags:
                - Event
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                eventId:
                                    type: string
                                    description: The content ID of the event whose schedule to extend
                                recurringDays:
                                    type: integer
                                    description: 'The days to recur on. Each item is a day name ("Monday"), a day number (0 = Sunday ... 6 = Saturday) or a day lookup object'
                                recurringWeeks:
                                    type: integer
                                    description: Number of weeks for the recurrence pattern
                                endDate:
                                    type: string
                                    description: The end date for the recurrence (ISO format)
                            required:
                                - eventId
                                - recurringDays
                                - recurringWeeks
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The event was not found

    /getLiveSchedule:
        get:
            summary: Retrieve the live schedule for an event
            operationId: getLiveSchedule
            description: Gets the live schedule configuration associated with the specified event, including channel, input, and output settings.
            tags:
                - Event
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                eventId:
                                    type: string
                                    description: The content ID of the event
                            required:
                                - eventId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The event or live schedule was not found

    /startLiveSchedule:
        post:
            summary: Start the live schedule for an event
            operationId: startLiveSchedule
            description: Activates the live schedule associated with the specified event, starting the live channel and beginning the broadcast.
            tags:
                - Event
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                eventId:
                                    type: string
                                    description: The content ID of the event whose schedule to start
                            required:
                                - eventId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The event or live schedule was not found

    /stopLiveSchedule:
        post:
            summary: Stop the live schedule for an event
            operationId: stopLiveSchedule
            description: Deactivates the live schedule associated with the specified event, stopping the broadcast and associated live channel.
            tags:
                - Event
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                eventId:
                                    type: string
                                    description: The content ID of the event whose schedule to stop
                            required:
                                - eventId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The event or live schedule was not found


    # ── Job ──
    /createJob:
        post:
            summary: Create a new processing job
            operationId: createJob
            description: Creates a job to process media from an S3 bucket or URL. The job can include specific tasks (e.g., transcoding, thumbnail generation) and transcode profiles. Supports callback notifications when the job completes.
            tags:
                - Job
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                bucketName:
                                    type: string
                                    description: The S3 bucket name containing the source media
                                objectKey:
                                    type: string
                                    description: The S3 object key for the source media file
                                notificationCallbackUrl:
                                    type: string
                                    description: URL to receive job completion notifications
                                externalId:
                                    type: string
                                    description: External system identifier for tracking the job
                                replaceExistingJob:
                                    type: boolean
                                    description: Whether to replace an existing job with the same external ID
                                assetUrl:
                                    type: string
                                    description: Direct URL to the source media (alternative to S3)
                                requestedTasks:
                                    type: array
                                    items:
                                        type: object
                                    description: Array of task objects to execute
                                requestedTranscodeProfiles:
                                    type: array
                                    items:
                                        type: object
                                    description: Array of transcode profile objects to apply
            responses:
                '200':
                    description: Success
                '400':
                    description: Invalid parameters provided
                '401':
                    description: The caller is not authenticated

    /createJobId:
        post:
            summary: Create a processing job for an asset
            operationId: createJobId
            description: Creates a new job record associated with the specified asset for external processing workflows. The job can include a callback URL and external identifier.
            tags:
                - Job
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                assetId:
                                    type: string
                                    description: The unique identifier of the asset
                                jobResultsUrl:
                                    type: string
                                    description: Callback URL for job results
                                externalId:
                                    type: string
                                    description: External system identifier for the job
                            required:
                                - assetId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The asset was not found


    # ── Live Channel ──
    /clipLiveChannel:
        post:
            summary: 'Create a clip from a live channel''s output'
            operationId: clipLiveChannel
            description: 'Extracts a segment from the live channel''s recorded output between the specified time codes and saves it as a new asset in the designated output folder.'
            tags:
                - Live Channel
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                liveChannelId:
                                    type: string
                                    description: The unique identifier of the live channel to clip
                                startTimeCode:
                                    type: string
                                    description: The start time code for the clip
                                endTimeCode:
                                    type: string
                                    description: The end time code for the clip
                                title:
                                    type: string
                                    description: The title for the clipped asset
                                outputFolderId:
                                    type: string
                                    description: The output folder ID where the clip will be saved
                                tags:
                                    type: array
                                    items:
                                        type: object
                                    description: Tags to assign to the clipped asset
                                collections:
                                    type: array
                                    items:
                                        type: object
                                    description: Collections to assign to the clipped asset
                                relatedContents:
                                    type: array
                                    items:
                                        type: object
                                    description: Related content to associate with the clip
                                videoBitrate:
                                    type: integer
                                    description: The video bitrate for the clip
                                audioTracks:
                                    type: array
                                    items:
                                        type: object
                                    description: Audio track configurations for the clip
                                useHlsSegmentBasedClipping:
                                    type: boolean
                                    description: Request HLS segment-based clipping (faster, may be less frame-accurate)
                            required:
                                - liveChannelId
                                - outputFolderId
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated
                '404':
                    description: The live channel was not found

    /createLiveChannel:
        post:
            summary: Create a new live channel
            operationId: createLiveChannel
            description: Provisions a new live channel with the specified configuration including type, security settings, and output options. Automatically generates a route name from the channel name and resolves security group names to IDs.
            tags:
                - Live Channel
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name:
                                    type: string
                                    description: The display name for the live channel
                                thumbnailImageId:
                                    type: string
                                    description: The asset ID of the thumbnail image
                                archiveFolderAssetId:
                                    type: string
                                    description: The asset ID of the archive folder
                                enableHighAvailability:
                                    type: boolean
                                    description: Whether to enable high availability
                                enableLiveClipping:
                                    type: boolean
                                    description: Whether to enable live clipping
                                isSecureOutput:
                                    type: boolean
                                    description: Whether the output stream is secure
                                isOutputScreenshots:
                                    type: boolean
                                    description: Whether to capture output screenshots
                                channelType:
                                    type: string
                                    description: 'The channel type: "External", "IVS", "Normal", or "Realtime"'
                                externalServiceApiUrl:
                                    type: string
                                    description: 'The external service API URL (required if type is "External")'
                                externalOutputProfiles:
                                    type: array
                                    items:
                                        type: object
                                    description: External output profile configurations
                                securityGroups:
                                    type: array
                                    items:
                                        type: string
                                    description: 'Security group names (e.g., "Content Manager", "Everyone", "Guest")'
                            required:
                                - name
                                - isSecureOutput
                                - isOutputScreenshots
                                - channelType
            responses:
                '200':
                    description: Success
                '400':
                    description: Bad Request
                '401':
                    description: The caller is not authenticated

    /deleteLiveChannel:
        delete:
